name: keyless_kawai
description: "A simple door unlocker for personal rooms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  flutter_launcher_icons: ^0.14.4
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons/keyless.png" # Added assets/

flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/keyless.png