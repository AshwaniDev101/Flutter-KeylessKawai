# Run this using: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

flutter_launcher_icons:
  # The primary image path for your app icon
  image_path: "assets/images/icons/keyless.png"

  # Android Configuration
  android: true
  min_sdk_android: 21

  # iOS Configuration (Turned off)
  ios: false

  # Web Configuration
  web:
    generate: true
    image_path: "assets/images/icons/keyless.png"
    background_color: "#ffffff"
    theme_color: "#000000"

  # Windows Configuration
  windows:
    generate: true
    image_path: "assets/images/icons/keyless.png"
    icon_size: 48